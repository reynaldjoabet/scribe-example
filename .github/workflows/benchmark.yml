name: Logging benchmark

# Runs bench/run.sh (cats Log[IO] + LogContext vs ZIO ZIO.log* + ScribeZLogger) and publishes a Markdown report to the
# run's summary page, plus the raw results as an artifact.
#
# Pull requests are compared against their base commit, pushes to main against the previous main commit, and manual
# runs against the `baseline` input. Baseline and candidate are benchmarked interleaved on the same runner, because
# numbers from different runs of a shared runner aren't comparable. The job fails if the custom logger ever tags a log
# line with a missing or wrong requestId; performance changes are reported, not enforced (runners are too noisy).
# A baseline is only compared if it has the same benchmark layout (bench/run.sh drives both checkouts).

on:
  pull_request:
    branches: [main]
    paths:
      - "common/src/main/**"
      - "common/src/test/scala/app/logging/BenchSupport.scala"
      - "cats/src/main/**"
      - "cats/src/test/scala/app/logging/CatsProductionBenchmark.scala"
      - "zio/src/main/**"
      - "zio/src/test/scala/app/logging/ZioProductionBenchmark.scala"
      - "bench/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths:
      - "common/src/main/**"
      - "common/src/test/scala/app/logging/BenchSupport.scala"
      - "cats/src/main/**"
      - "cats/src/test/scala/app/logging/CatsProductionBenchmark.scala"
      - "zio/src/main/**"
      - "zio/src/test/scala/app/logging/ZioProductionBenchmark.scala"
      - "bench/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Git ref to compare against (branch, tag or SHA); empty = no comparison"
        type: string
        default: main
      rounds:
        description: "Rounds per variant (more rounds = less noise, longer run)"
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROUNDS: ${{ inputs.rounds || '5' }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0

      - name: Choose baseline
        id: baseline
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_BASELINE: ${{ inputs.baseline }}
        run: |
          case "$EVENT" in
            pull_request) ref=$PR_BASE ;;
            push) ref=$PUSH_BEFORE ;;
            *) ref=$INPUT_BASELINE ;;
          esac
          # A push that creates the branch has no previous commit (all zeros)
          if [[ -z "$ref" || "$ref" =~ ^0+$ ]]; then
            echo "No baseline: running without comparison"
            exit 0
          fi
          sha=$(git -C candidate rev-parse --verify --quiet "$ref^{commit}" ||
                git -C candidate rev-parse --verify --quiet "origin/$ref^{commit}" || true)
          if [ -z "$sha" ]; then
            echo "::warning::Baseline '$ref' not found; running without comparison"
          elif ! git -C candidate cat-file -e "$sha:zio/src/test/scala/app/logging/ZioProductionBenchmark.scala" 2>/dev/null; then
            echo "::notice::Baseline $sha predates the cats vs ZIO benchmark; running without comparison"
          else
            echo "Baseline: $ref ($sha)"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out baseline
        if: steps.baseline.outputs.sha != ''
        env:
          SHA: ${{ steps.baseline.outputs.sha }}
        run: git -C candidate worktree add --detach ../baseline "$SHA"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
          cache-dependency-path: |
            candidate/**/*.sbt
            candidate/project/build.properties

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run benchmarks
        working-directory: candidate
        shell: bash
        env:
          HAS_BASELINE: ${{ steps.baseline.outputs.sha != '' }}
        run: |
          targets=(candidate=.)
          if [ "$HAS_BASELINE" = true ]; then targets=(baseline=../baseline candidate=.); fi
          bench/run.sh ../bench-results "$ROUNDS" "${targets[@]}"

      - name: Report
        shell: bash
        env:
          HAS_BASELINE: ${{ steps.baseline.outputs.sha != '' }}
        run: |
          args=(--check)
          if [ "$HAS_BASELINE" = true ]; then args+=(--baseline baseline --candidate candidate); fi
          python3 candidate/bench/report.py bench-results "${args[@]}" | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bench-results/
            report.md
          if-no-files-found: ignore
          retention-days: 90
